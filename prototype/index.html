<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="以原始构想为本体的城市经营与政策卡牌游戏：历史模式、自由构筑和独立绿化 DLC。">
<title>HDB · 社区经营</title>
<style>
/* Layout: fixed 1280×760 game stage scaled to fit. Top = date & time bar, left = event + goal rail,
   centre = rotatable low-poly 3D HDB neighbourhood (Three.js), right = active policies + AI advisor, bottom = Slay-the-Spire style fanned hand. */
:root{
  --night:#0c1a1d; --night-2:#12262a; --panel:#152d2f; --panel-2:#1b3836; --line:#2e4d4a;
  --ink:#f2eee3; --muted:#98ada7; --dim:#61756f;
  --heat:#ff7a33; --heat-soft:#ffb35e; --eco:#6cc46f; --gold:#e6b84a;
  --policy:#3f86a8; --power:#7b68c0; --event:#d0782c; --stop:#8b5f5a; --bad:#ef5a4c;
  --f-display:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;margin:0;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1280px;height:760px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
  background:radial-gradient(120% 90% at 55% 40%, #1a3a3b 0%, #10272a 55%, #0a1618 100%)}
#stage.hot{background:radial-gradient(120% 90% at 55% 40%, #3a3127 0%, #24241f 50%, #12191a 100%)}
#city,#fx{position:absolute;inset:0;width:1280px;height:760px}
#fx{pointer-events:none}
#city{cursor:grab}
#camCtl{position:absolute;right:30px;top:500px;z-index:30;width:150px;display:flex;flex-direction:column;align-items:center;gap:6px}
#camCtl .hint{font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 2px #000}
#camCtl .btns{display:flex;gap:8px}
#camCtl button{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff33;background:#0b1719cc;cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
#camCtl button:hover{border-color:var(--gold);color:var(--gold)}
#camCtl svg{width:16px;height:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,.pile:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- top bar: date & time ---------- */
#top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:linear-gradient(#081315,#0c1b1ecc);border-bottom:1px solid var(--line);z-index:20}
.place{display:flex;flex-direction:column;line-height:1.15;min-width:150px}
.place b{font-family:var(--f-display);font-size:16px;letter-spacing:.04em;white-space:nowrap}
.place span{font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.res{display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;background:#ffffff08;border:1px solid #ffffff10}
.chip .ico{width:18px;height:18px;flex:none}
.chip .lab{font-size:10px;color:var(--muted);letter-spacing:.08em;display:block;white-space:nowrap}
.chip .val{font-size:14px;font-weight:700}
.chip .sub{font-size:11px;color:var(--muted);margin-left:4px}
.delta.neg{color:var(--bad)} .delta.pos{color:var(--eco)}
.clock{margin-left:auto;display:flex;align-items:center;gap:14px}
.date{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.date b{font-family:var(--f-display);font-size:19px;white-space:nowrap}
.date span{font-size:11px;color:var(--muted);white-space:nowrap}
.timeline{display:flex;gap:3px;align-items:flex-end;height:30px}
.tl{width:14px;height:8px;border-radius:2px;background:#ffffff1a;position:relative}
.tl.past{background:#ffffff40}
.tl.now{height:14px;background:var(--ink);box-shadow:0 0 8px #fff8}
.tl.heat::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:3px;border-radius:2px;background:var(--heat)}
.tl.goal::before{content:"";position:absolute;left:4px;top:-14px;width:2px;height:12px;background:var(--gold)}
.tl.goal i{position:absolute;left:6px;top:-14px;width:8px;height:6px;background:var(--gold);clip-path:polygon(0 0,100% 50%,0 100%)}
.temp{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;border:1px solid #ffffff14}
.temp.on{border-color:#ff7a3366;background:#ff7a331a;color:var(--heat-soft)}
.temp b{font-size:15px}
#lang{display:flex;border:1px solid #ffffff2a;border-radius:16px;overflow:hidden;flex:none}
#lang button{border:0;background:transparent;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);letter-spacing:.04em}
#lang button[aria-pressed="true"]{background:var(--ink);color:#0c1a1d;font-weight:700}

/* ---------- side rails ---------- */
.rail{position:absolute;top:72px;display:flex;flex-direction:column;gap:12px;z-index:10}
#left{left:16px;width:272px}
#right{right:16px;width:178px;align-items:stretch}
.panel{background:linear-gradient(180deg,#173232f2,#122729f2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px #0006}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted);display:flex;align-items:center;gap:6px;text-transform:uppercase}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.panel h3{margin:6px 0 4px;font-family:var(--f-display);font-size:17px;text-wrap:balance}
.panel p{margin:0;font-size:12px;line-height:1.55;color:#cfd8d3}
.event.on{border-color:#ff7a3399;background:linear-gradient(180deg,#3a2a1ff2,#21201cf2)}
.event.on .eyebrow .dot{background:var(--heat);box-shadow:0 0 8px var(--heat);animation:pulse 1.4s infinite}
.heatbar{display:flex;gap:4px;margin:8px 0}
.heatbar i{flex:1;height:6px;border-radius:3px;background:#ffffff14}
.heatbar i.on{background:linear-gradient(90deg,var(--heat-soft),var(--heat))}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:6px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500;text-align:right}
.grant{margin-top:10px;padding-top:8px;border-top:1px dashed #ffffff22;font-size:11px;color:var(--heat-soft);line-height:1.5}
.goal .eyebrow .dot{background:var(--gold)}
.bar{height:8px;border-radius:4px;background:#ffffff14;margin:8px 0 2px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#4e9e6a,var(--eco));transition:width .6s}
.bar.goalbar::after{content:"";position:absolute;right:0;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.reward{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;margin-top:8px;font-size:11px;line-height:1.45}
.reward span:nth-child(odd){color:var(--muted);white-space:nowrap}
.goal.done{border-color:#6cc46f88} .goal.fail{border-color:#ef5a4c88}
.powers h4{margin:0 0 8px;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:500;text-transform:uppercase}
.power{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;background:#7b68c022;border:1px solid #7b68c055;margin-top:6px}
.power .pi{min-width:22px;height:22px;padding:0 3px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--power);font-size:10px;font-weight:700}
.power.ev .pi{background:var(--event)}
.power b{display:block;font-size:12px}
.power small{display:block;font-size:10.5px;color:var(--muted);line-height:1.4}
.power small.warn{color:var(--heat-soft)}
.empty{font-size:11px;color:var(--dim);line-height:1.5}
#advBtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid #6fb7c955;background:linear-gradient(180deg,#1d4148,#16323a);cursor:pointer;text-align:left}
#advBtn:hover{border-color:#8fd2e2}
.eye{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9f3ff,#3aa0bd 60%,#16505f);box-shadow:0 0 12px #3aa0bd88;flex:none}
#advBtn b{display:block;font-size:13px} #advBtn small{font-size:10.5px;color:var(--muted);line-height:1.35;display:block}
.note{font-size:10px;color:var(--dim);line-height:1.5;margin:0}

/* ---------- bottom controls ---------- */
#orb{position:absolute;left:46px;top:560px;width:96px;height:96px;border-radius:50%;z-index:30;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 40% 35%,#ffe9a8 0%,#e6b84a 32%,#8a5a16 72%,#3b2408 100%);box-shadow:0 0 0 3px #2b1c08,0 0 24px #e6b84a66,inset 0 -8px 16px #0006}
#orb .n{font-family:var(--f-num);font-size:28px;font-weight:700;color:#2a1904;text-shadow:0 1px 0 #fff6;line-height:1}
#orb .l{font-size:10px;color:#3b2408;font-weight:700;letter-spacing:.1em;margin-top:2px;text-transform:uppercase}
html:lang(en) #orb .l{font-size:8.5px;letter-spacing:.06em}
#orb.empty{filter:saturate(.25) brightness(.7)}
#orb.shake{animation:shake .35s}
.pile{position:absolute;z-index:30;width:66px;height:78px;cursor:pointer;display:grid;place-items:center;border:0;background:none;padding:0}
.pile .stack{position:absolute;inset:6px 8px 14px;border-radius:7px;background:linear-gradient(160deg,#2b5c63,#173a40);border:2px solid #7fb3b8;box-shadow:4px 4px 0 #0f2b30,8px 8px 0 #0b2024}
.pile.disc .stack{background:linear-gradient(160deg,#5a4a40,#352a24);border-color:#b39a86;box-shadow:-4px 4px 0 #2a201b,-8px 8px 0 #1f1814}
.pile.exh .stack{background:linear-gradient(160deg,#4a2f3a,#2a1a22);border-color:#a07689;box-shadow:none;inset:14px 14px 18px}
.pile .cnt{position:absolute;bottom:0;right:0;min-width:24px;height:24px;border-radius:12px;background:#0c1a1d;border:2px solid currentColor;font-family:var(--f-num);font-weight:700;font-size:12px;display:grid;place-items:center;color:var(--ink)}
.pile .pl{position:absolute;bottom:-14px;left:-10px;right:-10px;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
#drawPile{left:22px;top:670px} #discPile{right:22px;top:670px} #exhPile{right:96px;top:688px;width:50px;height:60px}
#endTurn{position:absolute;right:30px;top:592px;z-index:30;width:150px;height:56px;border-radius:28px;border:2px solid #f1d58a;cursor:pointer;
  background:linear-gradient(180deg,#e9c766,#b17d22);color:#2a1904;font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:.12em;box-shadow:0 6px 0 #6b4510,0 10px 24px #0008}
html:lang(en) #endTurn{letter-spacing:.04em}
#endTurn:hover{filter:brightness(1.08)} #endTurn:active{transform:translateY(3px);box-shadow:0 3px 0 #6b4510}
#endTurn:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
#endTurn small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.06em;font-weight:500;opacity:.75;margin-top:-2px}

/* ---------- cards ---------- */
#hand{position:absolute;inset:0;pointer-events:none;z-index:40}
.card{position:absolute;left:0;top:0;width:160px;height:224px;margin:-112px 0 0 -80px;transform-origin:50% 50%;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),opacity .3s,filter .2s;will-change:transform;pointer-events:none}
.card.dragging{transition:none}
.card.flying{transition:transform .38s cubic-bezier(.5,0,.7,1),opacity .38s}
.cf{position:absolute;inset:0;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(170deg,var(--cc) 0%,color-mix(in srgb,var(--cc) 55%,#000) 100%);border:2px solid color-mix(in srgb,var(--cc) 60%,#fff);
  box-shadow:0 6px 14px #0009, inset 0 0 0 3px #0003}
.card.t-policy{--cc:var(--policy)} .card.t-power{--cc:var(--power)} .card.t-event{--cc:var(--event)} .card.t-stop{--cc:var(--stop)}
.card.playable .cf{box-shadow:0 0 0 2px #b9ffbf66,0 0 18px 4px #6cc46f88,0 6px 14px #0009}
.card.glow .cf{box-shadow:0 0 0 2px #c9f3ff,0 0 22px 6px #3aa0bdcc,0 6px 14px #0009}
.cost{position:absolute;left:-12px;top:-12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;z-index:2;
  background:radial-gradient(circle at 40% 35%,#ffe9a8,#e6b84a 40%,#7b4f12);border:2px solid #2b1c08;font-family:var(--f-num);font-weight:700;font-size:19px;color:#2a1904}
.card.nope .cost{color:#b3241a}
.cname{width:calc(100% + 10px);margin-top:2px;padding:4px 6px 5px;text-align:center;font-family:var(--f-display);font-weight:900;font-size:14.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(#00000055,#00000077);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);text-shadow:0 1px 2px #000}
html:lang(en) .cname{font-size:12px;letter-spacing:0;padding:5px 10px 6px 20px}
.art{width:132px;height:74px;margin-top:5px;border-radius:6px;overflow:hidden;border:2px solid #0006;box-shadow:inset 0 0 0 1px #fff3;flex:none}
.art svg{display:block;width:100%;height:100%}
.ctype{margin-top:-9px;padding:1px 9px;border-radius:9px;font-size:10px;letter-spacing:.08em;background:#0b1719;border:1px solid #ffffff33;z-index:1;white-space:nowrap}
html:lang(en) .ctype{letter-spacing:.02em;font-size:9.5px}
.ctext{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;line-height:1.45;padding:2px 4px;color:#f6f1e6;text-shadow:0 1px 1px #0008}
html:lang(en) .ctext{font-size:10.5px;line-height:1.32;padding:2px 2px}
.ctext k,.kwd{color:var(--gold);font-weight:700}
.ctags{display:flex;gap:4px;justify-content:center;min-height:16px}
.ctags span{font-size:9.5px;padding:0 6px;border-radius:6px;background:#0005;color:var(--gold);letter-spacing:.06em;line-height:16px}
.ribbon{position:absolute;right:-6px;top:40px;padding:2px 8px 2px 10px;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#2a1300;white-space:nowrap;
  background:linear-gradient(90deg,#ffc074,#ff8d3a);clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);box-shadow:0 2px 4px #0006;z-index:2}
.card.burn{animation:burn .7s forwards}

/* keyword tooltips (beside hovered card, as in StS) */
#kwtip{position:absolute;z-index:60;width:210px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#kwtip div{background:#0b1719f2;border:1px solid #e6b84a66;border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.5;color:#dfe6e2}
#kwtip b{display:block;color:var(--gold);font-size:12px;margin-bottom:1px}

#arrow{position:absolute;inset:0;z-index:45;pointer-events:none;overflow:visible}
#playline{position:absolute;left:300px;right:300px;top:500px;height:0;border-top:2px dashed #ffffff30;z-index:39;display:none}
#playline span{position:absolute;left:50%;transform:translate(-50%,-130%);font-size:11px;color:#ffffffaa;letter-spacing:.1em;white-space:nowrap}

/* ---------- tooltips, popovers, overlays ---------- */
#tip{position:absolute;z-index:70;min-width:200px;max-width:240px;pointer-events:none;background:#0b1719f2;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:0 8px 20px #0008}
#tip h5{margin:0 0 4px;font-size:13px;font-family:var(--f-display)}
#tip .row{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
#tip .row b{color:var(--ink);font-weight:500;text-align:right}
#tip .hint{margin-top:6px;font-size:11px;color:var(--gold)}
#pop{position:absolute;z-index:75;width:240px;background:#0b1719f7;border:1px solid #e6b84a77;border-radius:12px;padding:12px;box-shadow:0 10px 30px #000a}
#pop h5{margin:0 0 2px;font-family:var(--f-display);font-size:15px}
#pop p{margin:4px 0 10px;font-size:11.5px;line-height:1.5;color:#cfd8d3}
#pop .acts{display:flex;gap:8px}
#pop button{flex:1;padding:8px;border-radius:8px;border:1px solid #6cc46f88;background:#244c33;cursor:pointer;font-size:12.5px}
#pop button.ghost{border-color:#ffffff22;background:transparent;flex:none}
#pop button:disabled{opacity:.45;cursor:default}
#toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:560px}
#toast div{background:#0b1719f2;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12.5px;animation:tin .25s ease-out;text-align:center}
#toast div.warn{border-color:#ff7a3399;color:var(--heat-soft)} #toast div.good{border-color:#6cc46f99;color:#b9f0bb}
#report{position:absolute;left:50%;top:250px;transform:translate(-50%,-50%);z-index:85;width:350px;background:#0b1719f7;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 20px 50px #000c}
#report h4{margin:0;font-family:var(--f-display);font-size:16px}
#report .src{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
#report ul{list-style:none;margin:10px 0 6px;padding:0;font-size:12.5px}
#report li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #ffffff14}
#report li.tot{border:0;font-weight:700;padding-top:6px}
#report .foot{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}
#banner{position:absolute;left:0;right:0;top:300px;height:96px;z-index:90;pointer-events:none;display:grid;place-items:center;
  background:linear-gradient(90deg,transparent,#081315e6 20%,#081315e6 80%,transparent);opacity:0}
#banner b{font-family:var(--f-display);font-size:38px;letter-spacing:.2em;display:block;text-align:center}
#banner span{display:block;text-align:center;font-size:13px;color:var(--muted);letter-spacing:.2em;margin-top:2px}
#banner.show{animation:banner 1.5s ease-in-out forwards}
#banner.heat b{color:var(--heat-soft)}
#overlay{position:absolute;inset:0;z-index:95;background:#050c0deb;display:flex;flex-direction:column;align-items:center;padding:40px 60px}
#overlay h2{font-family:var(--f-display);margin:0 0 4px;font-size:24px}
#overlay .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
#overlay .grid{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;overflow:auto;padding:16px;max-height:560px}
#overlay .grid .card{position:relative;margin:0;transform:none;pointer-events:auto}
#overlay .close{position:absolute;right:30px;top:24px;padding:8px 16px;border-radius:20px;border:1px solid #ffffff33;background:#ffffff10;cursor:pointer}
#adv{position:absolute;right:0;top:56px;bottom:150px;width:380px;z-index:85;background:linear-gradient(180deg,#0e2226fa,#0b1a1dfa);border-left:1px solid #3aa0bd66;
  padding:16px 18px;overflow:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);box-shadow:-20px 0 40px #0008}
#adv.open{transform:none}
#adv h3{margin:0;font-family:var(--f-display);font-size:18px;display:flex;align-items:center;gap:10px}
#adv h3 .eye{width:22px;height:22px}
#adv .x{margin-left:auto;border:1px solid #ffffff22;background:none;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12px}
.advsec{margin-top:14px;border-radius:10px;padding:11px 12px}
.advsec.eng{background:#ffffff08;border:1px solid #ffffff1a}
.advsec.ai{background:#3aa0bd14;border:1px dashed #3aa0bd88}
.advsec .tag{font-size:10px;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;text-transform:uppercase}
.advsec.ai .tag{color:#8fd2e2}
.advsec ul{margin:8px 0 0;padding-left:16px;font-size:12.5px;line-height:1.6}
.advsec li{margin-bottom:4px}
.advsec li b{font-family:var(--f-num);font-weight:700}
#adv .hl{margin-top:10px;width:100%;padding:8px;border-radius:8px;border:1px solid #3aa0bd88;background:#16323a;cursor:pointer;font-size:12px}
#rotate{display:none}

@keyframes pulse{50%{opacity:.35}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@keyframes banner{0%{opacity:0;transform:scaleY(.2)}18%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
@keyframes burn{0%{filter:none}40%{filter:brightness(1.8) sepia(1) hue-rotate(-20deg);opacity:1}100%{filter:brightness(2) sepia(1);opacity:0;transform:var(--t) translateY(-60px) scale(.8)}}
@media (prefers-reduced-motion:reduce){.card,.bar i,#adv{transition:none}#banner.show{animation-duration:.01s}.event.on .eyebrow .dot{animation:none}}
@media (max-width:640px) and (orientation:portrait){#rotate{display:block;position:fixed;left:16px;right:16px;bottom:16px;padding:10px 12px;border-radius:10px;background:#152d2f;border:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;z-index:200}}
</style>

<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="stage">
  <canvas id="city" width="1280" height="760"></canvas>
  <canvas id="fx" width="1280" height="760"></canvas>

  <header id="top">
    <div class="place"><b data-i18n="place"></b><span data-i18n="placeSub"></span></div>
    <div class="res">
      <div class="chip"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#e6b84a"/><text x="10" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#3b2408">$</text></svg>
        <div><span class="lab" data-i18n="finance"></span><span class="val num" id="rMoney"></span><span class="sub num delta" id="rMoneyD"></span></div></div>
      <div class="chip"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6" r="3.5" fill="#cfd8d3"/><path d="M3 18c0-4 3-7 7-7s7 3 7 7z" fill="#cfd8d3"/></svg>
        <div><span class="lab" data-i18n="popCap"></span><span class="val num" id="rPop"></span></div></div>
      <div class="chip"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2c4 3 6 6 6 9a6 6 0 0 1-12 0c0-3 2-6 6-9z" fill="#6cc46f"/></svg>
        <div><span class="lab" data-i18n="liveLab"></span><span class="val num" id="rLive"></span></div></div>
    </div>
    <div class="clock">
      <div class="temp" id="temp" hidden><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><rect x="4" y="1" width="4" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="16" r="3.2" fill="currentColor"/></svg><b class="num" id="tempV"></b></div>
      <div class="timeline" id="timeline"></div>
      <div class="date"><b id="dateV"></b><span id="turnV"></span></div>
      <div id="lang" role="group" aria-label="Language / 语言"><button type="button" data-lang="zh" aria-pressed="false">中</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
    </div>
  </header>

  <aside class="rail" id="left">
    <section class="panel event" id="eventPanel"></section>
    <section class="panel goal" id="goalPanel"></section>
  </aside>

  <aside class="rail" id="right">
    <button id="advBtn" type="button"><span class="eye"></span><span><b data-i18n="advisor"></b><small data-i18n="advisorSub"></small></span></button>
    <section class="panel powers" id="powers"></section>
    <p class="note" data-i18n="protoNote"></p>
  </aside>

  <div id="orb"><div><div class="n num" id="ppV"></div><div class="l" data-i18n="pp"></div></div></div>
  <button class="pile" id="drawPile" type="button"><span class="stack"></span><span class="cnt" id="drawN"></span><span class="pl" data-i18n="drawPile"></span></button>
  <button class="pile disc" id="discPile" type="button"><span class="stack"></span><span class="cnt" id="discN"></span><span class="pl" data-i18n="discPile"></span></button>
  <button class="pile exh" id="exhPile" type="button" hidden><span class="stack"></span><span class="cnt" id="exhN"></span><span class="pl" data-i18n="exhPile"></span></button>
  <div id="camCtl"><span class="hint" data-i18n="camHint"></span><div class="btns"><button type="button" data-cam="-1" data-i18n-aria="camL"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5H3V1M3.6 5A7 7 0 1 1 3 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button type="button" data-cam="0" data-i18n-aria="camReset"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3l7 6.5M5 8v9h10V8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><button type="button" data-cam="1" data-i18n-aria="camR"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 5h4V1M16.4 5A7 7 0 1 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div></div>
  <button id="endTurn" type="button"><span data-i18n="endTurn"></span><small data-i18n="pressE"></small></button>

  <div id="playline"><span data-i18n="release"></span></div>
  <div id="hand" role="group" aria-label="政策手牌 / Policy hand"></div>
  <svg id="arrow" width="1280" height="760"></svg>
  <div id="kwtip" hidden></div>
  <div id="tip" hidden></div>
  <div id="pop" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="report" hidden></div>
  <div id="banner"><div><b id="bannerT"></b><span id="bannerS"></span></div></div>
  <aside id="adv"></aside>
  <div id="overlay" role="dialog" aria-modal="true" hidden></div>
<div id="gameMenu" role="dialog" aria-modal="true"></div>
<nav id="toolbar" aria-label="Game controls"></nav>
<div id="mapLegend"></div>
<div id="actionHint" role="status" hidden></div>
</div>
<div id="mobileControls" hidden></div>
<input id="importSave" type="file" accept="application/json,.json" hidden>
<noscript>这个游戏需要开启 JavaScript。This game requires JavaScript.</noscript>

<script src="vendor/three.min.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="view.js"></script>
<script src="app.js"></script>
</body>
</html>
